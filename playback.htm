<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Amazing Spider Man Scene Pack</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <section class="videoContainer">
        <div class="topBar">
            <div class="userContainer">
                <div class="profileImage"></div>
                <div class="span">
                    <h5>REALM.kun</h5>
                    <button>Follow</button>
                </div>
            </div>
            <section class="title" id="title"></section>

            <i class="fa-solid fa-gear"></i>
        </div>
        
        <video  id="video">
            <source src="media/The Amazing Spider Man Scene Pack.mp4" type="video/mp4">
        </video>
        <section class="controls">
            <button id="rewind"><i class="fa-solid fa-backward"></i></button>
            <button id="play"></button>
            <button id="forward"><i class="fa-solid fa-forward"></i></button>
        </section>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/js/all.js" integrity="sha512-YbiNgTNv2GVfwJwqGr9Xv9xWzPIEwaDOv3f2S6HFbRVeo/xuM87nKqkmBPctPP3sbvxv3EpNIRss+3gjEJbVrA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
